<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开始游戏</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .start-btn {
    padding: 18px 64px;
    font-size: 22px;
    letter-spacing: 4px;
    color: #fff;
    background: transparent;
    border: 2px solid #fff;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .start-btn:hover {
    background: #fff;
    color: #000;
  }
</style>
</head>
<body>
  <button class="start-btn" onclick="location.href='/a/'">开始游戏</button>
</body>
</html>
